x-app: &app
  image: faultwatch:local
  pull_policy: never
  environment: &app-env
    FAULTWATCH_DATABASE_URL: postgresql+psycopg://faultwatch:faultwatch-local@db:5432/faultwatch
    FAULTWATCH_MODEL_DIR: /models

services:
  db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: faultwatch
      POSTGRES_PASSWORD: faultwatch-local
      POSTGRES_DB: faultwatch
    ports:
      - "127.0.0.1:${FAULTWATCH_DB_PORT:-55433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "faultwatch", "-d", "faultwatch"]
      interval: 3s
      timeout: 3s
      retries: 15

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true

  api:
    <<: *app
    build: .
    environment:
      <<: *app-env
      FAULTWATCH_REDIS_URL: ${FAULTWATCH_REDIS_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${FAULTWATCH_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${FAULTWATCH_MODEL_DIR:-./artifacts/fd001-v1}
        target: /models
        read_only: true
        bind:
          create_host_path: false

  redis:
    image: redis:8.12.0-alpine
    profiles: [cache]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  kafka:
    image: apache/kafka:4.4.0
    profiles: [kafka]
    ports:
      - "127.0.0.1:${FAULTWATCH_KAFKA_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://127.0.0.1:${FAULTWATCH_KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: "1"
      KAFKA_LOG_RETENTION_BYTES: "67108864"
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 8s
      retries: 8
    volumes:
      - kafka:/var/lib/kafka/data

  rag-db:
    image: pgvector/pgvector:0.8.2-pg17
    profiles: [rag]
    environment:
      POSTGRES_USER: faultwatch
      POSTGRES_PASSWORD: faultwatch-local
      POSTGRES_DB: faultwatch_rag
    ports:
      - "127.0.0.1:55435:5432"
    volumes:
      - rag-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "faultwatch", "-d", "faultwatch_rag"]
      interval: 3s
      timeout: 3s
      retries: 15

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1d
      - --storage.tsdb.retention.size=256MB
    ports:
      - "127.0.0.1:${FAULTWATCH_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.3.1
    profiles: [monitoring]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${FAULTWATCH_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/monitoring/grafana:/etc/grafana/provisioning:ro
      - ./infra/monitoring/faultwatch.json:/etc/faultwatch/dashboards/faultwatch.json:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  prometheus:
  kafka:
  rag-data:
