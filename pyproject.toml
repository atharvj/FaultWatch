[project]
name = "faultwatch"
version = "0.1.0"
description = "Remaining useful life prediction on NASA C-MAPSS simulations"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "httpx2>=2.16,<3",
    "numpy>=2.2,<3",
    "pandas>=2.3,<3",
    "prometheus-client>=0.22,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "redis>=8,<9",
    "scikit-learn>=1.7,<1.10",
    "skops>=0.13,<0.17",
    "sqlalchemy>=2.0,<2.1",
    "threadpoolctl>=3.5,<4",
    "torch>=2.9,<2.13",
    "uvicorn>=0.34,<1",
]

[project.scripts]
faultwatch = "faultwatch.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.15,<0.16"]
aws = ["boto3>=1.44,<2", "moto[server]>=5.2,<6"]
kafka = ["confluent-kafka>=2.14,<3"]
spark = ["pyspark>=4.2,<5"]
rag = ["transformers>=4.57,<5", "pgvector>=0.4,<1", "sentencepiece>=0.2,<1"]
experiments = [
    "mlflow-skinny>=3.10,<4",
    "onnx>=1.18,<2",
    "onnxruntime>=1.22,<2",
    "onnxscript>=0.5,<1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
