apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: faultwatch
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: faultwatch
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: {{ .Values.image | quote }}
          imagePullPolicy: Never
          command: [alembic, upgrade, head]
          env:
            - name: FAULTWATCH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret | quote }}
                  key: FAULTWATCH_DATABASE_URL
      containers:
        - name: api
          image: {{ .Values.image | quote }}
          imagePullPolicy: Never
          env:
            - name: FAULTWATCH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret | quote }}
                  key: FAULTWATCH_DATABASE_URL
            - name: FAULTWATCH_MODEL_DIR
              value: /models
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
      volumes:
        - name: model
          hostPath:
            path: {{ .Values.modelHostPath | quote }}
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector:
    app.kubernetes.io/name: faultwatch
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.servicePort }}
      targetPort: http
