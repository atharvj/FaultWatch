apiVersion: v1
kind: ConfigMap
metadata:
  name: faultwatch
data:
  FAULTWATCH_MODEL_DIR: /models
  POSTGRES_DB: faultwatch
  POSTGRES_USER: faultwatch
---
apiVersion: v1
kind: Secret
metadata:
  name: faultwatch-dev
type: Opaque
stringData:
  POSTGRES_PASSWORD: faultwatch-local
  FAULTWATCH_DATABASE_URL: postgresql+psycopg://faultwatch:faultwatch-local@postgres:5432/faultwatch
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17.12-alpine
          envFrom:
            - configMapRef:
                name: faultwatch
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: faultwatch-dev
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -h, "127.0.0.1", -U, faultwatch, -d, faultwatch]
            periodSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: faultwatch:local
          imagePullPolicy: Never
          command: [alembic, upgrade, head]
          env:
            - name: FAULTWATCH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: faultwatch-dev
                  key: FAULTWATCH_DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      containers:
        - name: api
          image: faultwatch:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: faultwatch
          env:
            - name: FAULTWATCH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: faultwatch-dev
                  key: FAULTWATCH_DATABASE_URL
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
            timeoutSeconds: 4
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
      volumes:
        - name: model
          hostPath:
            path: /faultwatch-model
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: http
