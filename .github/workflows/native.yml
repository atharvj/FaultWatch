name: Native CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Native tests (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    env:
      ORT_DISABLE_TELEMETRY: "1"
      LOKY_MAX_CPU_COUNT: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.24"
          enable-cache: false
      - name: Build and run GoogleTest
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCHITECTURE"
          lscpu
          uv sync --locked --group experiments
          cmake -S native -B .local/native -DCMAKE_BUILD_TYPE=Release \
            -DPython_EXECUTABLE="$PWD/.venv/bin/python"
          cmake --build .local/native --parallel 3
          ctest --test-dir .local/native --output-on-failure
      - name: Verify held-out scores and run the benchmarks
        env:
          PYTHONPATH: .local/native/python
        run: |
          .venv/bin/faultwatch fetch
          .venv/bin/faultwatch train
          .venv/bin/faultwatch export-onnx --output artifacts/fd001-v1/model.onnx
          .venv/bin/python scripts/verify_native.py
          .local/native/faultwatch-native-bench 15
          .local/native/faultwatch-worker-bench artifacts/fd001-v1/model.onnx data/fd001/test_FD001.txt
