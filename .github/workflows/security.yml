name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python dependency and source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.24"
          enable-cache: false
      - run: uv audit --locked
      - run: uv run --locked ruff check --select S src/faultwatch

  container:
    name: Container vulnerability and secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Trivy
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
      - run: docker compose build api
      - name: Check the runtime image
        run: >-
          "$RUNNER_TEMP/trivy" image --no-progress --scanners vuln,secret
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 faultwatch:local
